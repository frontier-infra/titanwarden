name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Test
        run: uv run python -m unittest discover -s tests -v
      - name: Test with assertions disabled
        run: uv run python -O -m unittest discover -s tests -v
      - name: Hygiene
        run: |
          ! LC_ALL=C grep -R -n $'\342\200\223\|\342\200\224' --exclude-dir=.git --exclude-dir=.venv .
          uv run python -m compileall -q tw tests scripts
