name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # CI runs on Blacksmith runners, never on GitHub-hosted runners.
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Test
        run: uv run python -m unittest discover -s tests -v
      - name: Test with assertions disabled
        run: uv run python -O -m unittest discover -s tests -v
      - name: Hygiene
        run: |
          ! LC_ALL=C grep -R -n $'\342\200\223\|\342\200\224' --exclude-dir=.git --exclude-dir=.venv .
          uv run python -m compileall -q tw tests scripts
