[project]
name = "titanwarden"
version = "0.1.0"
description = "Local use-without-reveal secret broker for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "cryptography>=44",
  "pyahocorasick==2.3.0",
  "webauthn>=2.7,<3",
]

[project.scripts]
tw = "tw.cli:main"
twadmin = "tw.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tw"]

